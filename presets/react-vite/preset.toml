stack = "react-vite"
language = "TypeScript + React (Vite)"
code_globs = "**/*.ts,**/*.tsx"
maturity = "real"
skills = []
precommit = ["lint", "build"]
structure = """
src/
├── components/
├── pages/
├── services/
└── hooks/
"""

[commands]
test = "npm test"
lint = "npx eslint src/"
typecheck = "tsc --noEmit"
build = "npm run build"
